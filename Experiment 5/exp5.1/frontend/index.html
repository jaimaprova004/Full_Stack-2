<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Post Manager</a>
    <button class="btn btn-outline-light" id="newPostBtn">New Post</button>
  </div>
</nav>

<main class="container my-4">
  <div id="alertPlaceholder"></div>
  <div id="posts" class="row g-3"></div>
</main>

<!-- Create Modal -->
<div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="postForm">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input id="title" class="form-control" maxlength="200" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea id="content" class="form-control" rows="6" maxlength="5000" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Author</label>
            <input id="author" class="form-control" maxlength="100" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button id="saveBtn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
