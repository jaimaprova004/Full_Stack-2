<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RBAC Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>RBAC Demo — Cute & Vibrant</h1>
      <div id="userInfo" class="muted">Not signed in</div>
    </header>

    <section class="card auth">
      <h2>Sign In</h2>
      <form id="loginForm">
        <input id="username" placeholder="username (alice, bob, carol)" />
        <input id="password" type="password" placeholder="password" />
        <button>Sign In</button>
      </form>
      <div class="demo">
        <p>Quick demo sign-in:</p>
        <div class="demo-buttons">
          <button type="button" id="demoAlice">Demo: alice (admin)</button>
          <button type="button" id="demoBob">Demo: bob (editor)</button>
          <button type="button" id="demoCarol">Demo: carol (viewer)</button>
        </div>
      </div>
      <hr />
      <h3>Create account</h3>
      <form id="signupForm">
        <input id="su_username" placeholder="new username" />
        <input id="su_password" type="password" placeholder="password" />
        <select id="su_role">
          <option value="viewer">viewer</option>
          <option value="editor">editor</option>
          <option value="admin">admin</option>
        </select>
        <button>Create Account</button>
      </form>
    </section>

    <section class="card actions">
      <h2>Actions</h2>
      <div class="buttons">
        <button id="btnGetPosts">Get Posts</button>
        <button id="btnCreatePost">Create Post</button>
        <button id="btnAdmin">Admin Area</button>
      </div>
      <div id="posts" class="posts"></div>
    </section>

  </div>
  <script src="/app.js"></script>
</body>
</html>
